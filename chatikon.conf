# nginx -v 1.27.5 1.24.0
# /etc/nginx/nginx.conf
# limit_conn_zone $binary_remote_addr zone=ip_limit:10m; into http
# access_log off;
#	error_log /dev/null crit;

# ls /etc/nginx/conf.d
# sudo cp chatikon.conf /etc/nginx/conf.d/

# ============================================
# Map для WebSocket upgrade
# sudo nginx -t
# ============================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================================
# HTTP → HTTPS редирект
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name chatikon.ru;
    return 301 https://$host$request_uri;
    access_log off;
	error_log /dev/null crit;
}

# ============================================
# Основной сервер (HTTPS + HTTP/2 + HTTP/3)
# ============================================
server {
    # --- TCP: HTTP/1.1 + HTTP/2 ---
    #listen 443 ssl;
    #listen [::]:443 ssl;
    #http2 on;
    listen 443 ssl http2;
    # --- UDP: HTTP/3 (QUIC) ---
    #listen 443 quic reuseport;
    #listen [::]:443 quic reuseport;

    server_name chatikon.ru;

    # ========================================
    # SSL (подставьте свои пути к сертификатам)
    # ========================================
    ssl_certificate     /etc/letsencrypt/live/chatikon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatikon.ru/privkey.pem;

    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ========================================
    # HTTP/3 заголовки
    # ========================================
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Protocol $server_protocol always;

    # ========================================
    # Общие настройки proxy
    # ========================================
    # Увеличиваем таймауты для долгих соединений
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    send_timeout          60s;

    # ========================================
    # PeerJS Server (WebSocket + HTTP API)
    # ========================================
    location /peerjs {
        proxy_pass http://chatikon.ru:9000;

        proxy_http_version 1.1;

        # WebSocket заголовки (обязательно!)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Передаём реальные данные клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключаем буферизацию для real-time данных
        proxy_buffering off;

        # Таймауты специально для WebSocket (долгие соединения)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
location /gesamt {
        # Ограничение: не более 4 одновременных подключений с одного IP
        limit_conn ip_limit 4;
        # Возвращать ошибку 429 (Too Many Requests), если лимит превышен
        limit_conn_status 429; 

        # Проксирование на порт 3000
        proxy_pass http://chatikon.ru:3000;
        
        # Обязательные заголовки для WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Передача реальных IP и хоста в приложение
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Увеличиваем таймауты, чтобы WebSocket не разрывался при простое (по умолчанию 60 сек)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # ========================================
    # Express.js (API + фронтенд)
    # ========================================
    location / {
        proxy_pass http://chatikon.ru:3000;
        
        proxy_http_version 1.1;

        # Поддержка WebSocket, если Express тоже его использует
        # (например Socket.IO) — не мешает, если не используется
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Реальные данные клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключаем буферизацию для SSE / streaming
        proxy_buffering off;
    }
}


