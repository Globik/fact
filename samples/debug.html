<!DOCTYPE html>
<html>
<head>
    <style>body{margin:0;background:#000;color:white;font-family:sans-serif;}canvas{display:block;width:100vw;height:100vh;}</style>
</head>
<body>
<div id="log" style="position:absolute;top:10px;left:10px;z-index:999;background:rgba(0,0,0,0.7);padding:10px;"></div>
<canvas id="c"></canvas>

<script>
// ============================================================================
// УТИЛИТЫ ЛОГИРОВАНИЯ
// ============================================================================
const logEl = document.getElementById('log');
function log(msg) {
    console.log(msg);
    logEl.innerHTML += msg + "<br>";
}

// ============================================================================
// ИНИЦИАЛИЗАЦИЯ WEBGL
// ============================================================================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false }); // Отключаем AA для чистоты теста

if (!gl) {
    alert("WebGL not supported");
    throw new Error("No WebGL");
}

log("WebGL Context Created OK");

// Размер канваса
function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

// ============================================================================
// ШЕЙДЕРЫ (МИНИМАЛЬНЫЕ ДЛЯ ОТЛАДКИ)
// ============================================================================

// Вершинный шейдер: просто берет позицию и передает её дальше
const vsSource = `
    attribute vec4 a_position;
    void main() {
        gl_Position = a_position;
    }
`;

// Фрагментный шейдер: красит всё в ярко-зеленый цвет
const fsSource = `
    precision mediump float;
    void main() {
        gl_FragColor = vec4(0.0, 1.0, 0.0, 1.0); // Ярко-зеленый
    }
`;

function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const info = gl.getShaderInfoLog(shader);
        log("SHADER COMPILE ERROR:\n" + info);
        alert("Shader Compile Error!\nSee console.");
        gl.deleteShader(shader);
        return null;
    }
    return shader;
}

function createProgram(gl, vs, fs) {
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const info = gl.getProgramInfoLog(program);
        log("PROGRAM LINK ERROR:\n" + info);
        alert("Program Link Error!");
        return null;
    }
    return program;
}

const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
const program = createProgram(gl, vertexShader, fragmentShader);

if (!program) {
    throw new Error("Failed to create program");
}

log("Shaders Compiled & Linked OK");

// Получаем локацию атрибута
const positionAttributeLocation = gl.getAttribLocation(program, "a_position");

// ============================================================================
// ГЕОМЕТРИЯ: ПРОСТОЙ ТРЕУГОЛЬНИК ПО ЦЕНТРУ ЭКРАНА
// ============================================================================

const positionBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

// Координаты в Clip Space (-1..1). 
// Треугольник по центру экрана.
const positions = [
     0.0,  0.5,  0.0, // Верхняя точка
    -0.5, -0.5,  0.0, // Левая нижняя
     0.5, -0.5,  0.0  // Правая нижняя
];

gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

// ============================================================================
// РЕНДЕР ЦИКЛ
// ============================================================================

function render() {
    // 1. Очистка фона (Черный)
    gl.clearColor(0.0, 0.0, 0.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // 2. Использование программы
    gl.useProgram(program);

    // 3. Привязка буфера позиций к атрибуту
    gl.enableVertexAttribArray(positionAttributeLocation);
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.vertexAttribPointer(
        positionAttributeLocation, 
        3,          // Количество компонентов (x,y,z)
        gl.FLOAT,   // Тип данных
        false,      // Нормализация
        0,          // Шаг (stride)
        0           // Смещение (offset)
    );

    // 4. Отрисовка
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    
    // Проверка ошибок GL
    const err = gl.getError();
    if (err !== 0) {
        log("GL ERROR CODE: " + err);
    }

    requestAnimationFrame(render);
}

render();

</script>
</body>
</html>
